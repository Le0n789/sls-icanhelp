name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# 设置 GitHub Pages 部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署运行
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          # 绑定自定义域名后，取消下一行注释（构建产物将以根路径 '/' 部署，配合 CNAME 文件）
          # PAGES_BASE: /
          PAGES_BASE: ${{ vars.PAGES_BASE }}

      # GitHub Pages 不支持 SPA 路由回退：把 index.html 复制为 404.html，
      # 用户直接访问/分享子页面链接（如 /cost-calculator）时不会 404
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
